<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 12</title>
<style>
    /* 关键：页面级纯黑，杜绝跳转白闪 */
    html, body { background: #000; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        transition: opacity .45s ease-out;
    }
    body.fadeout { opacity: 0; }

    .boot-stage {
        display: flex; flex-direction: column; align-items: center; gap: 30px;
    }

    /* 趴着的猫：黑线剪影用 invert(1) 转为白色线条 */
    .boot-cat {
        width: 130px; height: 130px; object-fit: contain;
        filter: invert(1);
        display: block;
    }

    /* 标语：衬线体，克制，不转大写 */
    .caption {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 16px;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,.85);
    }

    /* 单圆环 spinner：匀速 linear，无 SMIL 双环打架 */
    .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 7px solid rgba(255,255,255,.14);
        border-top-color: #ff2d95;
        animation: spin .85s linear infinite;
        opacity: 0;
    }
    .spinner.show { opacity: 1; transition: opacity .5s ease .1s; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: .01s; }
    }
</style>
</head>
<body>
    <div class="boot-stage">
        <img class="boot-cat" src="img/boot-cat.png" alt="Cat">
        <div class="caption">Art is Eternal</div>
        <div class="spinner" id="spinner"></div>
    </div>
    <script src="scripts/animation.js"></script>
</body>
</html>
