<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 12</title>
<link rel="icon" href="icon/logo.png" type="image/png">
<style>
    html, body { background: #000; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        height: 100vh; background: #000; color: #fff; overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none; cursor: default;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        position: relative;
    }
    .boot-wrap {
        text-align: center; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px;
        animation: fadeIn 0.5s ease-out;
    }
    .boot-wrap img {
        width: clamp(200px, 35vw, 380px); height: auto;
    }
    .boot-text {
        font-size: clamp(20px, 3.5vw, 32px); font-weight: 600;
        letter-spacing: 0.28em; color: #fff; text-indent: 0.28em;
    }
    .boot-f2 {
        position: absolute; bottom: 28px; left: 0; right: 0;
        text-align: center;
        font-size: clamp(11px, 1.6vw, 14px); color: #666;
        letter-spacing: 0.1em;
    }
    @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }
</style>
</head>
<body>
    <div class="boot-wrap">
        <img src="img/boot-cat-white.png?v=2025092508" alt="boot">
        <div class="boot-text">ART IS ETERNAL</div>
    </div>
    <div class="boot-f2">按 F2 进入 BIOS 设置</div>
    <script>
    (function () {
        'use strict';
        var done = false;
        function next() {
            if (done) return; done = true;
            window.location.href = './animation.html';
        }
        function bios() {
            if (done) return; done = true;
            window.location.href = './bios.html';
        }
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F2' || e.keyCode === 113) bios();
        });
        // 猫 + 文字停留 2 秒后进入开机动画
        setTimeout(next, 2000);
    })();
    </script>
</body>
</html>
