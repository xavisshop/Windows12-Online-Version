<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptio Setup Utility</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
        font-size: clamp(12px, 1.05vw, 17px);
        color: #000; background: #fff;
        display: flex; flex-direction: column; height: 100vh;
        overflow: hidden; user-select: none; -webkit-user-select: none;
    }

    /* ===== 顶部蓝色标题条 ===== */
    #topbar {
        flex-shrink: 0; background: #0000aa; color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px; height: clamp(36px, 5.6vh, 54px);
        font-weight: bold;
    }
    #topbar .brand { font-size: 1.05em; letter-spacing: .01em; white-space: nowrap; }
    #topbar .brand .copy { font-weight: normal; font-size: .78em; margin-left: 14px; }
    #topbar .clock { font-size: .92em; white-space: nowrap; font-weight: normal; }
    #topbar .clock span + span { margin-left: 18px; }

    /* ===== 标签页菜单栏 ===== */
    #tabs {
        flex-shrink: 0; display: flex; align-items: stretch;
        background: #c0c0c0; border-bottom: 1px solid #808080;
        padding: 0 12px; height: clamp(30px, 5vh, 46px);
    }
    #tabs button {
        font-family: inherit; font-size: .95em; color: #0000aa;
        background: none; border: none; cursor: pointer;
        padding: 0 26px; white-space: nowrap;
    }
    #tabs button.active { background: #fff; color: #0000aa; font-weight: bold; }

    /* ===== 主体：选项区 + 帮助区 ===== */
    #content {
        flex: 1; display: flex; min-height: 0;
        padding: clamp(10px, 2vh, 22px) clamp(14px, 2.4vw, 36px);
        gap: clamp(14px, 2.4vw, 36px);
    }
    #pane { flex: 1; min-width: 0; overflow: auto; padding: 4px 2px; }
    .row {
        display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        align-items: center; padding: 3px 10px; cursor: default; line-height: 1.7;
        white-space: nowrap;
    }
    .row .k { overflow: hidden; text-overflow: ellipsis; }
    .row .v { color: #000; }
    .row.opt .v { color: #0000aa; }
    .row.sel { background: #0000aa; color: #fff; }
    .row.sel .v { color: #fff; }

    #help {
        flex-shrink: 0; width: clamp(240px, 27vw, 400px);
        border: 1px solid #808080; background: #fff;
        padding: 10px 14px; align-self: flex-start;
        max-height: 100%; overflow: auto;
    }
    #help h2 {
        font-size: .95em; font-weight: bold; color: #0000aa;
        border-bottom: 1px solid #808080; padding-bottom: 6px; margin-bottom: 8px;
    }
    #help p { font-size: .88em; line-height: 1.9; color: #000; }

    /* ===== 底部按键说明栏 ===== */
    #keys {
        flex-shrink: 0; background: #c0c0c0; border-top: 1px solid #808080;
        display: flex; align-items: center; flex-wrap: wrap;
        gap: 6px clamp(16px, 2.6vw, 40px);
        padding: 0 20px; height: clamp(30px, 5vh, 46px);
        font-size: .85em; color: #000; white-space: nowrap; overflow: hidden;
    }
    #keys b { color: #0000aa; margin-right: 6px; }

    /* ===== 朴素直角对话框 ===== */
    #dlgWrap {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; z-index: 10;
    }
    #dlgWrap.show { display: flex; }
    #dlg {
        background: #fff; border: 2px solid #000;
        min-width: min(440px, 88vw); padding: 26px 30px 22px; text-align: center;
    }
    #dlg p { margin-bottom: 22px; font-size: .95em; }
    #dlg .btns { display: flex; gap: 18px; justify-content: center; }
    #dlg button {
        font-family: inherit; font-size: .92em; min-width: 96px;
        padding: 5px 0; cursor: pointer;
        background: #fff; color: #000; border: 1px solid #000;
    }
    #dlg button.focus { background: #0000aa; color: #fff; border-color: #0000aa; }
</style>
</head>
<body>
    <header id="topbar">
        <div class="brand">Aptio Setup Utility<span class="copy">Copyright (C) 2026 American Megatrends, Inc.</span></div>
        <div class="clock"><span id="clkDate">--- --/--/----</span><span id="clkTime">--:--:--</span></div>
    </header>

    <nav id="tabs"></nav>

    <div id="content">
        <section id="pane"></section>
        <aside id="help">
            <h2>Item Specific Help</h2>
            <p id="helpText"></p>
        </aside>
    </div>

    <footer id="keys">
        <span><b>&#8592;&#8594;</b>Select Screen</span>
        <span><b>&#8593;&#8595;</b>Select Item</span>
        <span><b>Enter</b>Select</span>
        <span><b>F9</b>Optimized Defaults</span>
        <span><b>F10</b>Save &amp; Exit</span>
        <span><b>ESC</b>Exit</span>
    </footer>

    <div id="dlgWrap">
        <div id="dlg">
            <p id="dlgMsg"></p>
            <div class="btns">
                <button id="btnYes">Yes</button>
                <button id="btnNo">No</button>
            </div>
        </div>
    </div>

<script>
(function () {
'use strict';

var TABS = [
    { id: 'main', name: 'Main', rows: [
        { label: 'System Time', kind: 'clock',
          help: 'Set the system time. Use Tab to switch between Time elements.' },
        { label: 'System Date', kind: 'date',
          help: 'Set the system date. Use Tab to switch between Date elements.' },
        { label: 'Language', key: 'lang', def: 0,
          options: ['English', 'Francais', 'Deutsch', 'Espanol', 'Japanese'],
          help: 'Choose the default language.' },
        { label: 'BIOS Version', info: 'W12.1.0',
          help: 'Displays the BIOS version information.' },
        { label: 'Processor', info: 'Virtual CPU @ 3.20GHz',
          help: 'Displays the processor type and speed.' },
        { label: 'Total Memory', info: '4096 MB',
          help: 'Displays the total system memory size.' }
    ]},
    { id: 'adv', name: 'Advanced', rows: [
        { label: 'Hyper-Threading Technology', key: 'ht', def: 0,
          options: ['Enabled', 'Disabled'],
          help: 'Enabled for Windows XP and Linux (OS optimized for Hyper-Threading Technology) and Disabled for other OS (OS not optimized for Hyper-Threading Technology).' },
        { label: 'Intel(R) Virtualization Technology', key: 'vt', def: 0,
          options: ['Enabled', 'Disabled'],
          help: 'When enabled, a VMM can utilize the additional hardware capabilities provided by Vanderpool Technology.' },
        { label: 'SATA Mode Selection', key: 'sata', def: 0,
          options: ['AHCI', 'RAID', 'IDE'],
          help: 'Determines how SATA controller(s) operate.' },
        { label: 'USB Legacy Support', key: 'usb', def: 0,
          options: ['Enabled', 'Disabled'],
          help: 'Enables or disables Legacy USB support. Disable option will keep USB devices available only for EFI applications.' }
    ]},
    { id: 'boot', name: 'Boot', rows: [
        { label: 'Boot Option #1', key: 'b1', def: 0,
          options: ['Windows Boot Manager', 'UEFI: USB', 'Disabled'],
          help: 'Sets the system boot order.' },
        { label: 'Boot Option #2', key: 'b2', def: 1,
          options: ['UEFI: USB', 'Windows Boot Manager', 'Disabled'],
          help: 'Sets the system boot order.' },
        { label: 'Fast Boot', key: 'fb', def: 1,
          options: ['Enabled', 'Disabled'],
          help: 'Enables or disables boot with initialization of a minimal set of devices required to launch active boot option.' }
    ]},
    { id: 'sec', name: 'Security', rows: [
        { label: 'Administrator Password', key: 'apw', def: 0,
          options: ['Not Installed', 'Installed'],
          help: 'Set Administrator Password.' },
        { label: 'User Password', key: 'upw', def: 0,
          options: ['Not Installed', 'Installed'],
          help: 'Set User Password.' },
        { label: 'Secure Boot', key: 'sb', def: 0,
          options: ['Enabled', 'Disabled'],
          help: 'Secure Boot can be enabled if the system is running in User mode with an enrolled Platform Key (PK).' }
    ]},
    { id: 'exit', name: 'Save & Exit', rows: [
        { label: 'Save Changes and Exit', action: 'save',
          help: 'Exit system setup after saving the changes.' },
        { label: 'Discard Changes and Exit', action: 'discard',
          help: 'Exit system setup without saving any changes.' },
        { label: 'Restore Defaults', action: 'defaults',
          help: 'Load Optimized Defaults.' }
    ]}
];

var state = { tab: 0, row: 0 };
var vals = {};
TABS.forEach(function (t) {
    t.rows.forEach(function (r) { if (r.key) vals[r.key] = r.def || 0; });
});
function resetVals() {
    TABS.forEach(function (t) {
        t.rows.forEach(function (r) { if (r.key) vals[r.key] = r.def || 0; });
    });
}

function $(s) { return document.querySelector(s); }
function fmt(n) { return (n < 10 ? '0' : '') + n; }
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function tick() {
    var d = new Date();
    $('#clkTime').textContent = fmt(d.getHours()) + ':' + fmt(d.getMinutes()) + ':' + fmt(d.getSeconds());
    $('#clkDate').textContent = DOW[d.getDay()] + ' ' + fmt(d.getMonth() + 1) + '/' + fmt(d.getDate()) + '/' + d.getFullYear();
}
setInterval(tick, 1000); tick();

function rowVal(r) {
    var d = new Date();
    if (r.kind === 'clock') return fmt(d.getHours()) + ':' + fmt(d.getMinutes()) + ':' + fmt(d.getSeconds());
    if (r.kind === 'date') return DOW[d.getDay()] + ' ' + fmt(d.getMonth() + 1) + '/' + fmt(d.getDate()) + '/' + d.getFullYear();
    if (r.info !== undefined) return r.info;
    if (r.options) return r.options[vals[r.key]];
    return '';
}

function render() {
    var t = TABS[state.tab];
    $('#tabs').innerHTML = TABS.map(function (x, i) {
        return '<button class="' + (i === state.tab ? 'active' : '') + '" data-i="' + i + '">' + x.name + '</button>';
    }).join('');
    $('#pane').innerHTML = t.rows.map(function (r, i) {
        var v = rowVal(r), editable = !!r.options;
        return '<div class="row' + (i === state.row ? ' sel' : '') + (editable ? ' opt' : '') + '" data-i="' + i + '">' +
            '<span class="k">' + r.label + '</span>' +
            '<span class="v">' + (v !== '' ? (editable ? '[' + v + ']' : v) : '') + '</span>' +
            '</div>';
    }).join('');
    $('#helpText').textContent = t.rows[state.row].help || '';

    Array.prototype.forEach.call($('#tabs').children, function (b) {
        b.addEventListener('click', function () {
            state.tab = +b.dataset.i; state.row = 0; render();
        });
    });
    Array.prototype.forEach.call($('#pane').children, function (el) {
        el.addEventListener('click', function () {
            state.row = +el.dataset.i; activate();
        });
    });
}

/* ---------- 对话框 ---------- */
var dlgOpen = false, dlgFocus = 0, dlgYes = null;
function openDlg(msg, onYes) {
    $('#dlgMsg').textContent = msg;
    dlgYes = onYes || null; dlgFocus = 0; dlgOpen = true;
    paintDlg();
    $('#dlgWrap').classList.add('show');
}
function closeDlg() {
    dlgOpen = false; dlgYes = null;
    $('#dlgWrap').classList.remove('show');
}
function paintDlg() {
    $('#btnYes').classList.toggle('focus', dlgFocus === 0);
    $('#btnNo').classList.toggle('focus', dlgFocus === 1);
}
$('#btnYes').addEventListener('click', function () { var f = dlgYes; closeDlg(); if (f) f(); });
$('#btnNo').addEventListener('click', closeDlg);

function leave() { window.location.href = './boot.html'; }

function doAction(a) {
    if (a === 'save') openDlg('Save configuration and exit?', leave);
    else if (a === 'discard') openDlg('Discard changes and exit?', leave);
    else if (a === 'defaults') openDlg('Load Optimized Defaults?', function () { resetVals(); render(); });
}

function activate() {
    var r = TABS[state.tab].rows[state.row];
    if (r.action) { doAction(r.action); return; }
    if (!r.options) return;
    var n = r.options.length;
    vals[r.key] = (vals[r.key] + 1) % n;
    render();
}

document.addEventListener('keydown', function (e) {
    if (dlgOpen) {
        switch (e.key) {
            case 'ArrowLeft': case 'ArrowRight': case 'Tab':
                dlgFocus = 1 - dlgFocus; paintDlg(); break;
            case 'Enter':
                var f = dlgYes; if (dlgFocus === 1) f = null; closeDlg(); if (f) f(); break;
            case 'Escape': closeDlg(); break;
            case 'y': case 'Y': var fy = dlgYes; closeDlg(); if (fy) fy(); break;
            case 'n': case 'N': closeDlg(); break;
            default: return;
        }
        e.preventDefault(); return;
    }
    var rows = TABS[state.tab].rows.length, n = TABS.length;
    switch (e.key) {
        case 'ArrowLeft':
            state.tab = (state.tab + n - 1) % n; state.row = 0; break;
        case 'ArrowRight':
            state.tab = (state.tab + 1) % n; state.row = 0; break;
        case 'ArrowUp':
            state.row = (state.row + rows - 1) % rows; break;
        case 'ArrowDown':
            state.row = (state.row + 1) % rows; break;
        case 'Enter': activate(); return;
        case 'F9':
            openDlg('Load Optimized Defaults?', function () { resetVals(); render(); }); return;
        case 'F10':
            openDlg('Save configuration and exit?', leave); return;
        case 'Escape': leave(); return;
        default: return;
    }
    render(); e.preventDefault();
});

render();
})();
</script>
</body>
</html>
