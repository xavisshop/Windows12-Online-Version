<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Utility</title>
<style>
    html, body { background: #0e1116; height: 100%; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
        color: #e8eaf0; overflow: hidden; user-select: none; -webkit-user-select: none;
        display: flex; flex-direction: column; height: 100vh;
        font-size: clamp(12px, 1.02vw, 16px);
    }

    /* 顶栏 */
    .su-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 clamp(16px, 2.4vw, 40px);
        height: clamp(44px, 7vh, 62px); flex-shrink: 0;
        background: #161a21; border-bottom: 1px solid #2a303b;
    }
    .su-title { font-weight: 700; font-size: clamp(15px, 1.4vw, 21px); letter-spacing: .02em; }
    .su-title .ver { font-weight: 400; color: #8b93a5; font-size: .72em; margin-left: 12px; }
    .su-clock { color: #9aa3b5; font-size: .86em; text-align: right; line-height: 1.5; }

    /* 标签页 */
    .su-tabs {
        display: flex; gap: 2px; padding: 0 clamp(16px, 2.4vw, 40px);
        background: #161a21; border-bottom: 1px solid #2a303b; flex-shrink: 0;
    }
    .su-tab {
        padding: clamp(8px, 1.4vh, 13px) clamp(18px, 2.2vw, 34px);
        color: #9aa3b5; cursor: pointer; font-size: .95em; border: none; background: none;
        font-family: inherit;
    }
    .su-tab.active { background: #e8eaf0; color: #0e1116; font-weight: 700; }

    /* 主体三栏 */
    .su-body { flex: 1; display: flex; min-height: 0; }
    .su-nav {
        width: clamp(150px, 15vw, 230px); flex-shrink: 0;
        border-right: 1px solid #2a303b; padding: clamp(10px, 1.6vh, 18px) 0;
    }
    .su-nav button {
        display: block; width: 100%; text-align: left; background: none; border: none;
        color: #9aa3b5; font-family: inherit; font-size: .95em;
        padding: clamp(8px, 1.5vh, 14px) clamp(16px, 2.4vw, 40px); cursor: pointer;
    }
    .su-nav button.sel { background: #232936; color: #fff; border-left: 3px solid #ff2d95; }

    .su-main { flex: 1; padding: clamp(12px, 2.4vh, 26px) clamp(18px, 3vw, 48px); overflow: auto; }
    .su-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: clamp(7px, 1.3vh, 12px) 12px; border-radius: 4px; cursor: default;
    }
    .su-row .k { color: #c6ccda; }
    .su-row .v { color: #fff; font-weight: 700; }
    .su-row.sel { background: #232936; }
    .su-row .v.edit { color: #ff7ab8; }

    .su-help {
        width: clamp(220px, 24vw, 360px); flex-shrink: 0;
        border-left: 1px solid #2a303b; padding: clamp(12px, 2.4vh, 26px) clamp(16px, 2vw, 30px);
        color: #9aa3b5; font-size: .88em; line-height: 2;
    }
    .su-help h3 { color: #e8eaf0; font-size: 1em; margin-bottom: 8px; font-weight: 700; }
    .su-help b { color: #e8eaf0; display: inline-block; min-width: 52px; }

    /* 底栏 */
    .su-foot {
        flex-shrink: 0; display: flex; align-items: center; gap: clamp(14px, 2.4vw, 36px);
        padding: 0 clamp(16px, 2.4vw, 40px); height: clamp(38px, 6vh, 54px);
        background: #161a21; border-top: 1px solid #2a303b;
        color: #9aa3b5; font-size: .85em; white-space: nowrap; overflow: hidden;
    }
    .su-foot b { color: #e8eaf0; margin-right: 6px; }

    /* 对话框 */
    .su-dlg-wrap {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.55); z-index: 10;
    }
    .su-dlg-wrap.show { display: flex; }
    .su-dlg {
        background: #161a21; border: 1px solid #3a4150; border-radius: 6px;
        padding: 26px 34px; min-width: min(420px, 86vw); text-align: center;
    }
    .su-dlg p { margin-bottom: 20px; }
    .su-dlg .btns { display: flex; gap: 12px; justify-content: center; }
    .su-dlg button {
        font-family: inherit; font-size: .95em; padding: 8px 26px; cursor: pointer;
        background: #232936; color: #fff; border: 1px solid #3a4150; border-radius: 4px;
    }
    .su-dlg button.primary { background: #e8eaf0; color: #0e1116; font-weight: 700; border-color: #e8eaf0; }
</style>
</head>
<body>
    <header class="su-head">
        <div class="su-title">Windows 12 Setup Utility<span class="ver">v1.0.0</span></div>
        <div class="su-clock"><div id="suTime">--:--:--</div><div id="suDate">----/--/--</div></div>
    </header>

    <nav class="su-tabs" id="suTabs">
        <button class="su-tab active" data-tab="main">Main</button>
        <button class="su-tab" data-tab="adv">Advanced</button>
        <button class="su-tab" data-tab="boot">Boot</button>
        <button class="su-tab" data-tab="sec">Security</button>
        <button class="su-tab" data-tab="exit">Save &amp; Exit</button>
    </nav>

    <div class="su-body">
        <div class="su-nav" id="suNav"></div>
        <div class="su-main" id="suMain"></div>
        <aside class="su-help">
            <h3>帮助</h3>
            <div><b>&larr;&rarr;</b>切换标签页</div>
            <div><b>&uarr;&darr;</b>选择项目</div>
            <div><b>Enter</b>修改数值</div>
            <div><b>F10</b>保存并退出</div>
            <div><b>ESC</b>退出</div>
        </aside>
    </div>

    <footer class="su-foot">
        <span><b>F1</b>帮助</span><span><b>F9</b>恢复默认</span>
        <span><b>F10</b>保存并退出</span><span><b>ESC</b>退出</span>
    </footer>

    <div class="su-dlg-wrap" id="suDlg">
        <div class="su-dlg">
            <p id="suDlgText">保存更改并退出？</p>
            <div class="btns">
                <button class="primary" id="suDlgYes">是</button>
                <button id="suDlgNo">否</button>
            </div>
        </div>
    </div>

<script>
(function () {
'use strict';

var TABS = {
    main: {
        nav: ['系统信息', '日期时间', '语言'],
        rows: [
            ['系统时间', 'time', null], ['系统日期', 'date', null],
            ['语言', 'lang', ['简体中文', 'English']],
            ['BIOS 版本', 'biosv', null], ['处理器', 'cpu', null], ['内存', 'mem', null]
        ]
    },
    adv: {
        nav: ['处理器', '存储', '显示'],
        rows: [
            ['超线程技术', 'ht', ['Enabled', 'Disabled']],
            ['虚拟化技术', 'vt', ['Enabled', 'Disabled']],
            ['SATA 模式', 'sata', ['AHCI', 'RAID', 'IDE']],
            ['USB 传统支持', 'usb', ['Enabled', 'Disabled']]
        ]
    },
    boot: {
        nav: ['启动顺序', '安全启动'],
        rows: [
            ['启动选项 #1', 'b1', ['Windows Boot Manager', 'UEFI: USB', 'Disabled']],
            ['启动选项 #2', 'b2', ['UEFI: USB', 'Windows Boot Manager', 'Disabled']],
            ['安全启动', 'sb', ['Enabled', 'Disabled']],
            ['快速启动', 'fb', ['Enabled', 'Disabled']]
        ]
    },
    sec: {
        nav: ['密码'],
        rows: [
            ['管理员密码', 'apw', ['未设置', '已设置']],
            ['用户密码', 'upw', ['未设置', '已设置']]
        ]
    },
    exit: {
        nav: ['退出选项'],
        rows: [
            ['保存更改并退出', 'act_save', null],
            ['放弃更改并退出', 'act_discard', null]
        ]
    }
};

var state = { tab: 'main', nav: 0, row: 0 };
var vals = {};

function $(s) { return document.querySelector(s); }
function $all(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

function fmt(n) { return (n < 10 ? '0' : '') + n; }
function tick() {
    var d = new Date();
    $('#suTime').textContent = fmt(d.getHours()) + ':' + fmt(d.getMinutes()) + ':' + fmt(d.getSeconds());
    $('#suDate').textContent = d.getFullYear() + '/' + fmt(d.getMonth() + 1) + '/' + fmt(d.getDate());
}
setInterval(tick, 1000); tick();

function rowVal(r) {
    var key = r[1], d = new Date();
    if (key === 'time') return fmt(d.getHours()) + ':' + fmt(d.getMinutes()) + ':' + fmt(d.getSeconds());
    if (key === 'date') return d.getFullYear() + '/' + fmt(d.getMonth() + 1) + '/' + fmt(d.getDate());
    if (key === 'biosv') return 'W12.1.0';
    if (key === 'cpu') return 'Virtual CPU';
    if (key === 'mem') return '4096 MB';
    if (r[2]) { if (!(key in vals)) vals[key] = 0; return r[2][vals[key]]; }
    return '';
}

function render() {
    var t = TABS[state.tab];
    $('#suNav').innerHTML = t.nav.map(function (n, i) {
        return '<button class="' + (i === state.nav ? 'sel' : '') + '" data-i="' + i + '">' + n + '</button>';
    }).join('');
    $('#suMain').innerHTML = t.rows.map(function (r, i) {
        var v = rowVal(r), editable = !!r[2];
        return '<div class="su-row' + (i === state.row ? ' sel' : '') + '" data-i="' + i + '">' +
            '<span class="k">' + r[0] + '</span>' +
            (v !== '' ? '<span class="v' + (editable ? ' edit' : '') + '">[' + v + ']</span>' : '') +
            '</div>';
    }).join('');
    $all('#suTabs .su-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.tab === state.tab);
    });
}

function dlg(show, text, onYes) {
    $('#suDlgText').textContent = text;
    $('#suDlg').classList.toggle('show', show);
    $('#suDlgYes').onclick = function () { dlg(false); if (onYes) onYes(); };
    $('#suDlgNo').onclick = function () { dlg(false); };
}

function leave() { window.location.href = './boot.html'; }

function cycle(dir) {
    var r = TABS[state.tab].rows[state.row];
    if (!r[2]) {
        if (r[1] === 'act_save') dlg(true, '保存更改并退出？', leave);
        else if (r[1] === 'act_discard') dlg(true, '放弃更改并退出？', leave);
        return;
    }
    var k = r[1], n = r[2].length;
    vals[k] = ((vals[k] || 0) + dir + n) % n;
    render();
}

$all('#suTabs .su-tab').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; state.nav = 0; state.row = 0; render(); });
});
$('#suNav').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.nav = +b.dataset.i; state.row = 0; render();
});
$('#suMain').addEventListener('click', function (e) {
    var r = e.target.closest('.su-row'); if (!r) return;
    state.row = +r.dataset.i; cycle(1);
});

document.addEventListener('keydown', function (e) {
    if ($('#suDlg').classList.contains('show')) {
        if (e.key === 'Escape') dlg(false);
        return;
    }
    var tabs = Object.keys(TABS), ti = tabs.indexOf(state.tab);
    var rows = TABS[state.tab].rows.length;
    switch (e.key) {
        case 'ArrowLeft': state.tab = tabs[(ti + tabs.length - 1) % tabs.length]; state.nav = 0; state.row = 0; break;
        case 'ArrowRight': state.tab = tabs[(ti + 1) % tabs.length]; state.nav = 0; state.row = 0; break;
        case 'ArrowUp': state.row = (state.row + rows - 1) % rows; break;
        case 'ArrowDown': state.row = (state.row + 1) % rows; break;
        case 'Enter': cycle(1); return;
        case 'F10': dlg(true, '保存更改并退出？', leave); return;
        case 'Escape': leave(); return;
        default: return;
    }
    render(); e.preventDefault();
});

render();
})();
</script>
</body>
</html>
